<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重庆大学小青🐟人格测评</title>
    <script src="https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/dist/dom-to-image.min.js"></script>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        
        body {
            background-color: #FFF9F2;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#FF8C3810 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* 卡片容器 */
        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 140, 56, 0.1);
            overflow: hidden;
            position: relative;
        }
        
        /* 页面通用样式 */
        .section {
            padding: 40px;
            display: none;
        }
        
        .active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* --- 封面页深度优化样式 --- */
        #welcome-section {
            padding: 0; /* 去掉封面页的容器内边距 */
            background: none;
            overflow: hidden;
            border-radius: 20px; /* 保持与容器一致的圆角 */
        }

        .welcome-container {
            position: relative;
            width: 100%;
            display: block; /* 改为块级展示 */
            padding: 0;
            min-height: auto;
        }
        
        .welcome-image-wrapper {
            position: relative;
            width: 100%;
            max-width: none; /* 移除最大宽度限制，由外层container控制 */
            border-radius: 0; /* 封面内部图片不设置独立圆角 */
            overflow: hidden;
            box-shadow: none; /* 移除内部阴影 */
            transition: none;
        }
        
        .cover-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
        
        .start-button-container {
            position: absolute;
            bottom: 5%; /* 距离图片底部5% */
            right: 5%;  /* 距离图片右侧5% */
            z-index: 10;
        }
        
        #start-btn {
            background: linear-gradient(135deg, #FF8C38, #FFA563);
            border: none;
            color: white;
            /* 响应式尺寸设计 */
            width: 120px;
            height: 120px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(255, 140, 56, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            white-space: nowrap;
            line-height: 1;
            padding: 10px;
            letter-spacing: 1px;
        }

        /* 欢迎页装饰文字 - 移到图片上方，增加可读性 */
        .welcome-decoration {
            position: absolute;
            top: 5%;
            left: 5%;
            font-size: 12px;
            color: white;
            background: rgba(255, 140, 56, 0.7);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        
        #start-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: all 0.6s ease;
        }
        
        #start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 25px rgba(255, 140, 56, 0.6);
        }
        
        #start-btn:hover::before {
            left: 100%;
        }
        
        #start-btn:active {
            transform: scale(0.95);
        }
        /* --- 封面页优化结束 --- */
        
        /* 标题样式 */
        h1 {
            color: #FF8C38;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        h2 {
            color: #FF8C38;
            margin-bottom: 20px;
            font-size: 22px;
        }
        
        h3 {
            color: #555;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: normal;
            text-align: center;
        }
        
        /* 按钮样式 */
        .btn {
            background-color: #FF8C38;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }
        
        .btn:hover {
            background-color: #FF7A18;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 122, 24, 0.3);
        }
        
        .btn:disabled {
            background-color: #FFD28F;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        /* 下载按钮特殊样式 */
        .download-btn {
            background-color: #4CAF50;
        }
        
        .download-btn:hover {
            background-color: #45a049;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        
        /* 题目样式 */
        .question {
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .option {
            padding: 15px 20px;
            border: 2px solid #FFD28F;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .option:hover {
            background-color: #FFF5EB;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 140, 56, 0.1);
        }
        
        .option.selected {
            background-color: #FF8C38;
            color: white;
            border-color: #FF8C38;
        }
        
        .option.selected::after {
            content: "✓";
            position: absolute;
            right: 20px;
            font-weight: bold;
            font-size: 18px;
        }
        
        .progress {
            height: 8px;
            background-color: #FFE8D2;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background-color: #FF8C38;
            border-radius: 4px;
            transition: width 0.3s ease;
            background: linear-gradient(90deg, #FF8C38, #FFA563);
        }
        
        /* 问卷页左上角图片样式 - 改为响应式 */
        .question-section-header {
            position: relative;
            margin-bottom: 20px;
            padding-top: 60px; /* 为图片预留空间 */
        }
        
        .corner-image {
            position: absolute;
            top: 0;        /* 固定在顶部 */
            left: 0;       /* 固定在左侧 */
            width: 15vw;      /* 使用vw单位 */
            max-width: 80px;  /* 设置最大宽度 */
            min-width: 40px;  /* 设置最小宽度 */
            height: auto;
            opacity: 0.8;
            z-index: 10; /* 确保在进度条上方 */
        }
        
        /* 新增：问卷页右上角Logo样式 - 改为响应式 */
        .header-logo {
            position: absolute;
            top: 0;        /* 固定在顶部 */
            right: 0;      /* 固定在右侧 */
            width: 20vw;      /* 使用vw单位 */
            max-width: 120px; /* 设置最大宽度 */
            min-width: 60px;  /* 设置最小宽度 */
            height: auto;
            opacity: 0.8;
            z-index: 10; /* 确保在进度条上方 */
        }
        
        .question-content {
            position: relative;
            z-index: 2;
            padding-right: 20px; /* 增加右侧内边距，避免文字被Logo遮挡 */
        }
        
        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
        }
        
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #FFD28F;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #FF8C38;
            box-shadow: 0 0 0 3px rgba(255, 140, 56, 0.1);
        }
        
        .checkbox-group, .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .checkbox-item, .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border: 1px solid #FFD28F;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .checkbox-item input, .radio-item input {
            width: 16px;
            height: 16px;
            margin: 0;
            flex-shrink: 0;
        }
        
        .checkbox-item label, .radio-item label {
            margin: 0;
            cursor: pointer;
            line-height: 1.2;
        }
        
        .checkbox-item:hover, .radio-item:hover {
            background-color: #FFF5EB;
            transform: translateY(-2px);
        }
        
        input[type="checkbox"]:checked + label, 
        input[type="radio"]:checked + label {
            color: #FF8C38;
            font-weight: bold;
        }
        
        input[type="checkbox"]:checked, input[type="radio"]:checked {
            accent-color: #FF8C38;
        }
        
        /* 结果页样式 */
        .result-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        
        .result-header::after {
            content: "";
            display: block;
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #FF8C38, transparent);
            margin: 20px auto 0;
        }
        
        .result-card {
            text-align: center;
            padding: 40px 30px;
            background: linear-gradient(135deg, #FFF5EB, #FFFAF2);
            border-radius: 20px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(255, 140, 56, 0.1);
        }
        
        .result-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #FF8C38, #FFB067);
        }
        
        .personality-type {
            font-size: 24px;
            color: #FF8C38;
            font-weight: bold;
            margin: 15px 0;
            letter-spacing: 1px;
        }
        
        .personality-name {
            font-size: 28px;
            margin-bottom: 20px;
            color: #333;
            font-weight: 600;
        }
        
        .personality-desc {
            color: #666;
            line-height: 1.8;
            font-size: 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .info-card {
            background-color: #FFF9F2;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            border-left: 4px solid #FF8C38;
            box-shadow: 0 5px 15px rgba(255, 140, 56, 0.08);
        }
        
        .info-card h2 {
            margin-bottom: 20px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-card h2::before {
            content: "📝";
            font-size: 20px;
        }
        
        .info-list {
            list-style: none;
            text-align: left;
            margin: 0;
            padding-left: 20px;
            line-height: 1.8;
        }
        
        /* 四维简介样式优化 */
        #dimension-summary li {
            margin-bottom: 18px;
            font-size: 15px;
            position: relative;
        }
        
        #dimension-summary li strong {
            color: #FF8C38;
            font-size: 16px;
        }
        
        #dimension-summary li li {
            margin-bottom: 10px;
            padding-left: 5px;
            color: #555;
        }
        
        /* 新增提示语样式 */
        .result-tips {
            text-align: center;
            padding: 20px 30px;
            margin: 20px 0;
            color: #666;
            font-size: 16px;
            line-height: 1.8;
        }
        
        .result-footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #FFE8D2;
        }
        
        /* 错误提示样式 */
        .error-message {
            color: #FF4444;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #FFF0F0;
            border-radius: 8px;
            display: none;
            border: 1px solid #FFCCCC;
        }
        
        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        /* 题目页提示 */
        .question-error {
            color: #FF4444;
            text-align: center;
            margin: 10px 0;
            display: none;
        }
        
        .question-error.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        /* 信件页面样式 */
        .letter-content {
            line-height: 1.8;
            font-size: 16px;
            padding: 30px;
            background: linear-gradient(135deg, #FFF5EB, #FFFAF2);
            border-radius: 15px;
            min-height: 400px;
            position: relative;
            box-shadow: 0 5px 15px rgba(255, 140, 56, 0.08);
            white-space: pre-line;
            color: #333; /* 确保文字颜色 */
            cursor: pointer; /* 添加鼠标指针样式 */
        }
        
        .letter-content strong {
            color: #FF8C38;
        }
        
        /* 高亮文本样式 - 加粗并橙色 */
        .highlight-text {
            color: #FF8C38;
            font-weight: bold;
        }
        
        .signature {
            text-align: right;
            margin-top: 30px;
        }
        
        .typing::after {
            content: "|";
            animation: blink 1s infinite;
            color: #FF8C38;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        /* 截图专用样式 - 确保背景和文字清晰 */
        .screenshot-target {
            background-color: white !important;
            color: #333 !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        
        /* 加载提示样式 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            display: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #FFE8D2;
            border-top: 5px solid #FF8C38;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 18px;
            color: #FF8C38;
        }
        
        /* 成就页中间图片样式 - 修改为响应式定位 */
        .achievement-header {
            position: relative;
            min-height: 500px; /* 增加最小高度以容纳图片 */
            overflow: visible; /* 确保图片完全显示 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .human-image {
            position: absolute;
            top: 50%;       /* 垂直居中 */
            left: 50%;      /* 水平居中 */
            transform: translate(-50%, -50%); /* 真正居中 */
            width: auto;    /* 自动宽度 */
            height: 70%;    /* 设置高度比例，确保完整显示 */
            max-height: 350px; /* 设置最大高度 */
            opacity: 0.2;   /* 降低透明度避免遮挡文字 */
            z-index: 1;
            object-fit: contain; /* 确保图片完整显示 */
        }
        
        .achievement-content {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 20px;
        }

        /* 联系页样式 - 新增 */
        .contact-content {
            padding: 30px;
            background: linear-gradient(135deg, #FFF5EB, #FFFAF2);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(255, 140, 56, 0.08);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .contact-item {
            margin-bottom: 30px;
        }
        
        .contact-title {
            font-size: 22px;
            color: #FF8C38;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .qrcode-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(255, 140, 56, 0.1);
            max-width: 350px;
            margin: 0 auto;
        }
        
        .qrcode-img {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 10px;
            object-fit: contain;
        }
        
        .contact-text {
            font-size: 18px;
            line-height: 1.8;
            color: #333;
        }
        
        .email-link {
            color: #FF8C38;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .email-link:hover {
            color: #FF7A18;
            text-decoration: underline;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .question {
                font-size: 18px; /* 平板设备上的题目字号 */
            }
            .section {
                padding: 20px;
            }
            
            #welcome-section {
                padding: 0;
            }

            #start-btn {
                width: 100px;
                height: 100px;
                font-size: 16px;
            }

            .human-image {
                height: 60%;     /* 在平板上调整高度 */
                max-height: 280px;
                opacity: 0.15;
            }
            
            /* 问卷页图片在平板上的调整 */
            .corner-image {
                width: 12vw;
                max-width: 60px;
            }
            
            .header-logo {
                width: 16vw;
                max-width: 90px;
            }

            /* 联系页平板响应式 */
            .contact-content {
                padding: 20px;
            }
            
            .qrcode-container {
                max-width: 280px;
                padding: 15px;
            }
            
            .qrcode-img {
                max-width: 250px;
            }
            
            .contact-text {
                font-size: 16px;
            }
            
            /* 提示语响应式 */
            .result-tips {
                padding: 15px 20px;
                font-size: 15px;
            }
        }
        
        @media (max-width: 480px) {
            .question {
                font-size: 18px; /* 手机设备上的题目字号 */
            }           
            .human-image {
                height: 50%;     /* 在手机上调整高度 */
                max-height: 220px;
                opacity: 0.1;
            }
            
            .achievement-content {
                padding: 15px;
            }
            
            #start-btn {
                width: 90px;
                height: 90px;
                font-size: 14px;
                padding: 5px;
            }
            
            /* 问卷页图片在手机上的调整 */
            .corner-image {
                width: 10vw;
                max-width: 50px;
            }
            
            .header-logo {
                width: 14vw;
                max-width: 70px;
            }
            
            /* 增加问题内容的内边距，避免文字被图片遮挡 */
            .question-content {
                padding-right: 15px;
            }

            /* 联系页手机响应式 */
            .qrcode-container {
                max-width: 220px;
                padding: 10px;
            }
            
            .qrcode-img {
                max-width: 200px;
            }
            
            .contact-text {
                font-size: 15px;
            }
            
            /* 提示语响应式 */
            .result-tips {
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="welcome-section" class="section active">
            <div class="welcome-container">
                <div class="welcome-image-wrapper">
                    <img src="cover.png" alt="封面" class="cover-image">
                    <div class="welcome-decoration">重庆大学青年志愿者协会</div>
                    <div class="start-button-container">
                        <button id="start-btn">开始测评</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="question-section" class="section">
            <div class="question-section-header">
                <img src="yu1.png" alt="装饰图片" class="corner-image">
                
                <img src="logo.png" alt="Logo" class="header-logo">
                
                <div class="question-content">
                    <div class="progress">
                        <div id="progress-bar" class="progress-bar" style="width: 10%;"></div>
                    </div>
                    <div id="question-number"></div>
                    <div id="question-text" class="question"></div>
                    
                    <div id="question-error" class="question-error">请选择一个选项后继续！</div>
                    
                    <div id="options-container" class="options"></div>
                    <div class="btn-group">
                        <button id="prev-btn" class="btn" disabled>上一题</button>
                        <button id="next-btn" class="btn">下一题</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="achievement-section" class="section">
            <div class="achievement-header">

        // 计算人格类型
        function calculatePersonality() {
            const scores = { H: 0, S: 0, L: 0, T: 0, A: 0, E: 0, C: 0, X: 0 };
            
            // 统计各维度得分
            for (let i = 0; i < questions.length; i++) {
                const selectedIndex = selectedOptions[i];
                const dimensions = questions[i].options[selectedIndex].dimension;
                dimensions.forEach(dim => {
                    scores[dim]++;
                });
            }
            
            // 确定每个维度的倾向（取得分高的，若相等则默认前者）
            const dim1 = scores.H >= scores.S ? "H" : "S"; // H/S
            const dim2 = scores.L >= scores.T ? "L" : "T"; // L/T
            const dim3 = scores.A >= scores.E ? "A" : "E"; // A/E
            const dim4 = scores.C >= scores.X ? "C" : "X"; // C/X
            
            return `${dim1}-${dim2}-${dim3}-${dim4}`;
        }

            }
            
            // 验证累计时长
            if (!hours) {
                showError("请填写累计志愿服务时长");
                return false;
            }
            if (parseInt(hours) < 0) {
                showError("累计志愿服务时长不能为负数");
                return false;
            }
            
            // 验证开始年份（修改为2000-2026）
            if (!year) {
                showError("请填写开始志愿服务的年份");
                return false;
            }
            if (parseInt(year) < 2000 || parseInt(year) > 2026) {
                showError("开始志愿服务的年份需在2000年至2026年之间");
                return false;
            }
            
            // 验证志愿带来的改变
            if (changes.length === 0) {
                showError("请选择至少一项志愿带给你的改变");
                return false;
            }
            
            // 验证明年想尝试的服务类型
            if (!nextType) {
                showError("请选择明年最想尝试的服务类型");
                return false;
            }
            
            // 验证形容志愿服务的词汇
            if (!description) {
                showError("请选择一个词形容你的志愿服务");
                return false;
            }
            
            return true;
        }
        
        // 显示错误信息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add("show");
            
            // 3秒后自动隐藏错误提示
            setTimeout(() => {
                errorMessage.classList.remove("show");
            }, 3000);
        }

        // 获取表单数据
        function getFormData() {
            const nickname = nicknameInput.value;
            const hours = totalHoursInput.value;
            const year = startYearInput.value;
            
            // 获取多选值
            const changes = [];
            document.querySelectorAll('input[name="change"]:checked').forEach(el => {
                changes.push(el.value);
            });
            
            // 获取单选值
            const nextType = document.querySelector('input[name="next-type"]:checked').value;
            const description = document.querySelector('input[name="description"]:checked').value;
            
            return { nickname, hours, year, changes, nextType, description };
        }

        // 显示结果
        function showResult() {
            const personality = personalities[personalityResult];
            
            // 设置人格结果
            resultType.textContent = personalityResult;
            resultName.textContent = personality.name;
            resultDesc.textContent = personality.desc;
            
            // 渲染四维简介
            let dimensionHTML = "";
            dimensionInfo.forEach(dimGroup => {
                dimensionHTML += `<li><strong>${dimGroup.name}：</strong></li>`;
                dimGroup.items.forEach(item => {
                    dimensionHTML += `<li style="padding-left: 30px;">${item.key}. ${item.desc}</li>`;
                });
            });
            dimensionSummary.innerHTML = dimensionHTML;
        }

        // 生成信件内容（保持信件格式）
        function generateLetter(formData) {
            return `亲爱的<span class="highlight-text">${formData.nickname}</span>：

当你收到这封信时，意味着又一年的志愿服务时光被温柔地收纳、整理，成为了你生命中独特的一页。

回顾过去的一年，志愿服务为你带来了<span class="highlight-text">${formData.changes.join("、")}</span>等珍贵的改变。这些收获如星火，照亮前路，温暖记忆。

展望新的一年，我们欣喜地看到，你心中已经种下了<span class="highlight-text">${formData.nextType}</span>的种子。请带着你的热情与经验出发，我们相信，你定能在新的天地继续播撒爱与希望。

如果要用一个词来形容你的志愿服务，那么“<span class="highlight-text">${formData.description}</span>”再贴切不过。这是你的独特色彩，也是留给世界最美的印记。

感谢你，亲爱的小青鱼。愿你在未来的日子里，继续游弋在爱的江海里，勇敢，自由，且快乐。让我们一路公益，爱心满洋！

<div class="signature">重庆大学青年志愿者协会</div>`;
        }

        // 改进的打字机效果（支持HTML标签和换行，添加点击加速功能）
        function typeWriterEnhanced(text, element, speed = 60) {
            // 重置元素状态
            element.innerHTML = "";
            element.classList.add("typing");
            
            // 创建一个临时元素来解析HTML
            const tempElement = document.createElement('div');
            tempElement.innerHTML = text;
            
            // 获取所有节点（文本节点和元素节点）
            const nodes = Array.from(tempElement.childNodes);
            
            let currentNodeIndex = 0;
            let currentCharIndex = 0;
            let currentSpeed = speed;
            
            function processNextNode() {
                if (currentNodeIndex >= nodes.length) {
                    // 完成所有节点
                    element.classList.remove("typing");
                    return;
                }
                
                const node = nodes[currentNodeIndex];
                
                if (node.nodeType === Node.TEXT_NODE) {
                    // 处理文本节点
                    const textContent = node.textContent;
                    
                    if (currentCharIndex < textContent.length) {
                        // 添加下一个字符
                        element.innerHTML += textContent.charAt(currentCharIndex);
                        currentCharIndex++;
                        setTimeout(processNextNode, currentSpeed);
                    } else {
                        // 当前文本节点处理完毕，处理下一个节点
                        currentNodeIndex++;
                        currentCharIndex = 0;
                        setTimeout(processNextNode, 0);
                    }
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    // 处理元素节点（如 <br> 等）
                    const tagName = node.tagName.toLowerCase();
                    
                    if (tagName === 'br') {
                        // 换行标签直接添加
                        element.innerHTML += '<br>';
                        currentNodeIndex++;
                        setTimeout(processNextNode, currentSpeed * 2); // 换行时稍作停顿
                    } else if (tagName === 'div' && node.classList.contains('signature')) {
                        // 签名样式
                        element.innerHTML += node.outerHTML;
                        currentNodeIndex++;
                        setTimeout(processNextNode, currentSpeed * 5);
                    } else if (tagName === 'span' && node.classList.contains('highlight-text')) {
                        // 高亮文本 - 直接添加整个元素
                        element.innerHTML += node.outerHTML;
                        currentNodeIndex++;
                        setTimeout(processNextNode, currentSpeed * 3);
                    } else {
                        // 其他元素标签
                        const elementHTML = node.outerHTML;
                        element.innerHTML += elementHTML;
                        currentNodeIndex++;
                        setTimeout(processNextNode, currentSpeed * 5);
                    }
                } else {
                    // 其他类型节点，跳过
                    currentNodeIndex++;
                    setTimeout(processNextNode, 0);
                }
            }
            
            // 添加点击加速事件
            element.addEventListener('click', function() {
                if (!isAccelerated) {
                    currentSpeed = 5; // 加速到5ms
                    isAccelerated = true;
                }
            });
            
            processNextNode();
        }

        // 下载图片功能
        function downloadImage(targetElement, fileName) {
            // 显示加载提示
            loadingOverlay.style.display = "flex";
            
            // 配置选项，确保文字清晰
            const options = {
                quality: 1.0, // 图片质量
                scale: 2, // 缩放比例，提高清晰度
                useCORS: true,
                width: targetElement.offsetWidth,
                height: targetElement.offsetHeight,
                // 确保背景颜色正确渲染
                backgroundColor: targetElement.style.backgroundColor || "white",
                // 处理字体问题
                font: "16px 'Microsoft Yahei', sans-serif"
            };
            
            try {
                // 使用dom-to-image生成图片
                domtoimage.toBlob(targetElement, options)
                    .then(function (blob) {
                        // 隐藏加载提示
                        loadingOverlay.style.display = "none";
                        
                        // 创建下载链接
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        
                        // 释放资源
                        setTimeout(() => {
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }, 100);
                    })
                    .catch(function (error) {
                        // 隐藏加载提示
                        loadingOverlay.style.display = "none";
                        console.error('生成图片失败:', error);
                        alert('图片生成失败，请重试！');
                    });
            } catch (error) {
                loadingOverlay.style.display = "none";
                console.error('下载图片失败:', error);
                alert('图片下载失败，请重试！');
            }
        }

               // 事件监听
        startBtn.addEventListener("click", () => {
            welcomeSection.classList.remove("active");
            questionSection.classList.add("active");
            initQuestion();
        });

        prevBtn.addEventListener("click", () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                initQuestion();
            }
        });

        nextBtn.addEventListener("click", () => {
            // 检查是否选择了选项
            if (!selectedOptions.hasOwnProperty(currentQuestion)) {
                questionError.classList.add("show");
                // 轻微震动效果
                optionsContainer.style.animation = "shake 0.5s ease";
                setTimeout(() => {
                    optionsContainer.style.animation = "";
                }, 500);
                return;
            }
            
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                initQuestion();
            } else {
                // 计算人格类型
                personalityResult = calculatePersonality();
                // 跳转到成就页
                questionSection.classList.remove("active");
                achievementSection.classList.add("active");
            }
        });

        submitBtn.addEventListener("click", () => {
            // 表单验证
            if (!validateForm()) {
                return;
            }
            
            // 保存表单数据
            formData = getFormData();
            letterGenerated = false; // 重置信件生成状态
            
            // 显示结果页
            achievementSection.classList.remove("active");
            resultSection.classList.add("active");
            showResult();
        });

        toLetterBtn.addEventListener("click", () => {
            resultSection.classList.remove("active");
            letterSection.classList.add("active");
            
            // 重置打字速度
            typingSpeed = 60;
            isAccelerated = false;
            
            // 确保表单数据存在
            if (!formData) {
                formData = getFormData();
            }
            
            // 如果信件还未生成，先生成内容
            if (!letterGenerated) {
                letterTextContent = generateLetter(formData);
                letterGenerated = true;
            }
            
            // 使用改进的打字机效果显示信件
            typeWriterEnhanced(letterTextContent, letterContent, typingSpeed);
        });

        // 新增：联系我们按钮点击事件
        toContactBtn.addEventListener("click", () => {
            letterSection.classList.remove("active");
            contactSection.classList.add("active");
        });

        // 新增：返回信件按钮点击事件
        backToLetterBtn.addEventListener("click", () => {
            contactSection.classList.remove("active");
            letterSection.classList.add("active");
        });

        finalRestartBtn.addEventListener("click", () => {
            // 重置所有状态
            currentQuestion = 0;
            selectedOptions = {};
            personalityResult = "";
            formData = null;
            letterTextContent = "";
            letterGenerated = false;
            typingSpeed = 60;
            isAccelerated = false;
            
            // 重置表单
            nicknameInput.value = "";
            totalHoursInput.value = "";
            startYearInput.value = "";
            document.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(el => {
                el.checked = false;
            });
            
            // 隐藏错误提示
            errorMessage.classList.remove("show");
            questionError.classList.remove("show");
            
            // 返回欢迎页（同时隐藏联系页）
            letterSection.classList.remove("active");
            contactSection.classList.remove("active");
            resultSection.classList.remove("active");
            achievementSection.classList.remove("active");
            welcomeSection.classList.add("active");
        });

        // 结果页下载按钮事件
        downloadResultBtn.addEventListener("click", () => {
            const fileName = `小青鱼人格测评结果_${formData?.nickname || '未知用户'}.png`;
            downloadImage(resultSection, fileName);
        });

        // 信件页下载按钮事件
        downloadLetterBtn.addEventListener("click", () => {
            const fileName = `致小青鱼的一封信_${formData?.nickname || '未知用户'}.png`;
            downloadImage(letterSection, fileName);
        });
    </script>
